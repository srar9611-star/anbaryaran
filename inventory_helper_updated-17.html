let voiceRec=null;
function voiceForm(){
 const supported=('SpeechRecognition' in window)||('webkitSpeechRecognition' in window);
 $('mb').innerHTML=`<div id="voiceBox"><h2>ثبت با فرمان صوتی فارسی</h2><p class="sub">روی «شروع ضبط» بزنید و مثلاً بگویید: «فروش ۱۰ عدد میلگرد ۲۰ به علی، قیمت واحد ۲۵۰۰۰۰» یا «خرید ۵ عدد ورق از رضا».</p><div class="bt" style="flex-wrap:wrap;margin:10px 0"><button class="p" id="voiceStart" ${supported?'':'disabled'}>🎙 شروع ضبط</button><button id="voiceStop" disabled>توقف ضبط</button></div>${supported?'':'<p class="neg">مرورگر فعلی از تشخیص گفتار پشتیبانی نمی‌کند. می‌توانید متن فرمان را در کادر زیر تایپ کنید.</p>'}<div class="f"><label for="voiceText">متن تشخیص‌داده‌شده / فرمان فارسی</label><textarea id="voiceText" rows="4" placeholder="فرمان را بگویید یا اینجا تایپ کنید…"></textarea></div><p class="sub">فرمان به فرم خرید/فروش آماده می‌شود؛ قبل از ثبت، کالا، تعداد و قیمت را بررسی و تأیید کنید. ثبت خودکار بدون بازبینی انجام نمی‌شود.</p><div id="voiceErr" role="alert" class="neg"></div><div class="bt" style="flex-wrap:wrap"><button class="p" id="voiceUse">تفسیر فرمان و ادامه ثبت</button><button id="voiceCancel">بستن</button></div></div>`;

 $('voiceUse').onclick=()=>{
  const text=$('voiceText').value.trim();if(!text)return $('voiceErr').textContent='ابتدا فرمان را بگویید یا تایپ کنید.';
  const normalized=lat(text).replace(/[٬،]/g,' '), sale=/فروش|بفروش|فاکتور فروش|فروختن/.test(normalized), buy=/خرید|بخر|فاکتور خرید|خریدن/.test(normalized), invoice=/فاکتور|پیش فاکتور|پیش‌فاکتور/.test(normalized);
  const nums=[...normalized.matchAll(/\d+(?:\.\d+)?/g)].map(m=>Number(m[0]));
  const products=S.prods.map(p=>({p,terms:[p.name,p.code].filter(Boolean).sort((a,b)=>String(b).length-String(a).length)})).map(o=>({...o,match:o.terms.find(term=>term&&normalized.toLowerCase().includes(lat(String(term)).toLowerCase()))})).filter(o=>o.match).sort((a,b)=>String(b.match).length-String(a.match).length);
  const prod=products[0]?.p||S.prods[0];const qtyMatch=normalized.match(/(\d+(?:\.\d+)?)\s*(?:عدد|تا|کیلو(?:گرم)?|متر|شاخه|بسته|تن|کیلو)/);const qty=qtyMatch?Number(qtyMatch[1]):(nums[0]||1);const priceMatch=normalized.match(/(?:قیمت(?:\s*واحد)?|نرخ)\s*(?:واحد)?\s*(?:حدود\s*)?(\d+(?:\.\d+)?)/);const price=priceMatch?Number(priceMatch[1]):(nums.length>1?nums[nums.length-1]:defPrice(prod.id));

  W={step:3,type,cid:customer?String(customer.id):'',nn:'',addr:customer?.addr||'',phone:customer?.phone||'',items:[{pid:prod.id,qty:qty>0?qty:1,price,disc:0}],method:'cash',paid:'',days:'',date:curDate(),fy:defFy(),note:'فرمان صوتی: '+text,kid:'',wid:'',time:nowT()};
  $('md').hidden=true;wz();
  if(!customer){W.cid='';W.step=2;wz();const sel=$('w_cid');if(sel&&S.custs.length===0){W.step=3;wz()}}
 };
}

calc=function(tx=S.tx,fy=S.set.fy){const M=S.set.costMethod||'avg';const P={};
 S.prods.forEach(p=>P[p.id]={p,st:+p.open||0,avg:+p.cost||0,o:+p.open||0,inq:0,outq:0,buy:0,sell:0,profit:0,L:(+p.open>0?[{q:+p.open,c:+p.cost||0}]:[])});
 const UC={};
 const consume=(o,q)=>{if(M==='avg')return q*o.avg;let need=q,cost=0;
  while(need>1e-9&&o.L.length){const k=M==='lifo'?o.L.length-1:0,l=o.L[k],take=Math.min(need,l.q);cost+=take*l.c;l.q-=take;need-=take;if(l.q<=1e-9)o.L.splice(k,1)}
  if(need>1e-9)cost+=need*o.avg;return cost};
 const rows=[];
 [...tx,...(S.issues||[]).flatMap(h=>(h.items||[]).map(it=>({id:h.id,grp:'issue-'+h.id,type:'X',pid:it.pid,qty:it.qty,price:0,vat:0,date:h.date,fy:h.fy||defFy(),cid:'',method:'cash',paid:0,note:'حواله خروجی '+h.no,kid:h.kid,wid:h.wid,time:h.time})))]
 .sort((a,b)=>(a.fy||'')<(b.fy||'')?-1:(a.fy||'')>(b.fy||'')?1:a.date<b.date?-1:a.date>b.date?1:a.id-b.id)
 .forEach(t=>{const o=P[t.pid];if(!o)return;const all=fy==='all';if(!all&&t.fy>fy)return;const pri=!all&&t.fy<fy;const amt=t.qty*t.price,vat=amt*t.vat/100;let pr=null;

   o.avg=(o.st*o.avg+cost)/((o.st+t.qty)||1);o.st+=t.qty;o.L.push({q:t.qty,c:uc});

/* ===== نسخهٔ نهایی محاسبه: بازگشت از خرید و فروش به ترتیب تاریخ (پس از خرید مربوطه) ===== */
calc=function(tx=S.tx,fy=S.set.fy){const M=S.set.costMethod||'avg';const P={};
 S.prods.forEach(p=>P[p.id]={p,st:+p.open||0,avg:+p.cost||0,o:+p.open||0,inq:0,outq:0,buy:0,sell:0,profit:0,L:(+p.open>0?[{q:+p.open,c:+p.cost||0}]:[])});
 const UC={};
 const consume=(o,q)=>{if(M==='avg')return q*o.avg;let need=q,cost=0;
  while(need>1e-9&&o.L.length){const k=M==='lifo'?o.L.length-1:0,l=o.L[k],take=Math.min(need,l.q);cost+=take*l.c;l.q-=take;need-=take;if(l.q<=1e-9)o.L.splice(k,1)}
  if(need>1e-9)cost+=need*o.avg;return cost};
 const rows=[];
 [...tx,...(S.issues||[]).flatMap(h=>(h.items||[]).map(it=>({id:h.id,grp:'issue-'+h.id,type:'X',pid:it.pid,qty:it.qty,price:0,vat:0,date:h.date,fy:h.fy||defFy(),cid:'',method:'cash',paid:0,note:'حواله خروجی '+h.no,kid:h.kid,wid:h.wid,time:h.time})))]
 .sort((a,b)=>(a.fy||'')<(b.fy||'')?-1:(a.fy||'')>(b.fy||'')?1:(a.date||'')<(b.date||'')?-1:(a.date||'')>(b.date||'')?1:a.id-b.id)
 .forEach(t=>{const o=P[t.pid];if(!o)return;const all=fy==='all';if(!all&&t.fy>fy)return;const pri=!all&&t.fy<fy;
  const q=+t.qty||0,amt=q*(+t.price||0),vat=amt*(+t.vat||0)/100;let pr=null;
  if(t.type==='B'){o.avg=(o.st*o.avg+amt)/((o.st+q)||1);o.st+=q;o.L.push({q,c:+t.price||0});UC[t.id]=+t.price||0;if(!pri){o.inq+=q;o.buy+=amt}}
  else if(t.type==='RB'){const c=consume(o,q);o.st-=q;if(!pri){o.inq-=q;o.buy-=amt}if(pri){o.o=o.st;return}rows.push({...t,rate:t.vat,amt:-amt,vat:-vat,pr:0,after:o.st,p:o.p,cost:0});return}
  else if(t.type==='X'){consume(o,q);o.st-=q;if(!pri)o.outq+=q}
  else if(t.type==='R'){const uc=UC[t.ref]!=null?UC[t.ref]:(o.avg||0);const cost=q*uc;o.avg=(o.st*o.avg+cost)/((o.st+q)||1);o.st+=q;o.L.push({q,c:uc});
   const ramt=-amt,rcost=-cost;pr=ramt-rcost;if(!pri){o.outq-=q;o.sell+=ramt;o.profit+=pr}
   if(pri){o.o=o.st;return}rows.push({...t,rate:t.vat,amt:ramt,vat:-vat,pr,after:o.st,p:o.p,cost:rcost});return}
  else{const c=consume(o,q);UC[t.id]=q?c/q:0;pr=amt-c;o.st-=q;if(!pri){o.outq+=q;o.sell+=amt;o.profit+=pr}}
  if(pri){o.o=o.st;return}if(t.type==='X')return;rows.push({...t,rate:t.vat,amt,vat,pr,after:o.st,p:o.p,cost:amt-pr})});
 return{P,rows}};

 const opts=billLinkOpts();if(!opts.some(o=>o[0]===String(b.linkTx)))opts.unshift([String(b.linkTx),billLinkLabel(b)]);
 form('ویرایش بارنامه',[{k:'no',l:'شماره بارنامه (۱۸ رقمی)',v:String(b.no)},{k:'date',l:'تاریخ رویداد ورود (مثل ۱۴۰۵/۰۷/۲۴)',v:String(b.date)},{k:'time',l:'ساعت رویداد (مثل ۱۴:۳۰)',v:String(b.time||'')},{k:'qty',l:'تعداد کالا',t:'number',v:String(b.qty)},{k:'weight',l:'وزن باسکول‌شده (کیلوگرم)',t:'number',v:String(b.weight)},{k:'freight',l:'هزینه حمل',t:'number',v:String(b.freight||0)},{k:'link',l:'لینک به حواله ورودی',t:'select',o:[['','— انتخاب کنید —'],...opts],v:String(b.linkTx)}],v=>{
  const no=toEn2(String(v.no||'')).replace(/\s/g,'');if(!isBillNo(no))return 'شماره بارنامه باید دقیقاً ۱۸ رقم باشد.';
  if((S.bills||[]).some(x=>String(x.no)===no&&String(x.id)!==String(b.id)))return 'این شماره بارنامه قبلاً ثبت شده و باید منحصر به فرد باشد.';
  const tr=S.tx.find(t=>String(t.id)===String(v.link)&&isIncoming(t));if(!tr)return 'بارنامه را به یک حواله ورودی لینک کنید.';
  const d=fix(v.date);if(!d)return 'تاریخ را به شکل سال/ماه/روز وارد کنید.';
  const qty=+toEn2(String(v.qty||'')),w=+toEn2(String(v.weight||'')),fr=+toEn2(String(v.freight||'0'));
  if(!(qty>0))return 'تعداد کالا را وارد کنید.';if(!(w>0))return 'وزن باسکول‌شده را وارد کنید.';if(fr<0)return 'هزینه حمل نمی‌تواند منفی باشد.';
  const old=b.linkTx;if(old!==tr.id){const ot=S.tx.find(t=>String(t.id)===String(old));if(ot&&ot.bill===b.no)delete ot.bill}
  Object.assign(b,{no,date:d,time:String(v.time||''),qty,weight:w,freight:fr,linkTx:tr.id});tr.bill=no;return undefined})}
function billDelete(id){const b=billById(id);if(!b)return failOp('این بارنامه پیدا نشد.');
 appConfirm('بارنامهٔ '+FA(b.no)+' حذف شود؟').then(ok=>{if(!ok)return;
  try{const t=S.tx.find(x=>String(x.id)===String(b.linkTx));if(t&&t.bill===b.no)delete t.bill;S.bills=(S.bills||[]).filter(x=>String(x.id)!==String(b.id));save();silentUi(()=>render());okMsg('بارنامه حذف شد');billListOpen()}catch(err){failOp(err.message||'حذف انجام نشد')}})}
const _blo0=billListOpen;
billListOpen=function(){_blo0();try{const body=$('fBody');if(!body)return;
 body.querySelectorAll('tbody tr').forEach(tr=>{const b=(S.bills||[]).find(x=>String(x.no)===(tr.children[0]?.textContent||'').trim()||toEn2(tr.children[0]?.textContent||'')===String(x.no));
  if(!b||tr.querySelector('[data-bl]'))return;tr.insertAdjacentHTML('beforeend','<td><button type="button" data-bl="det" data-id="'+b.id+'">جزئیات</button> <button type="button" data-bl="edit" data-id="'+b.id+'">ویرایش</button> <button type="button" data-bl="del" data-id="'+b.id+'" class="d">حذف</button></td>')});
 const th=body.querySelector('thead tr');if(th&&!th.querySelector('.blh'))th.insertAdjacentHTML('beforeend','<th class="blh">عملیات</th>')}catch(err){}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-bl]');if(!b)return;e.stopPropagation();const id=b.dataset.id;
 if(b.dataset.bl==='det')billDetails(id);else if(b.dataset.bl==='edit')billEdit(id);else billDelete(id)});

/* ===== دکمه‌های عملیات: جزئیات سبز، ویرایش زرد، حذف قرمز؛ بستن = ضربدر قرمز بالا-چپ ===== */
function ensureX(){const mb=$('mb');if(!mb)return;
 mb.querySelectorAll('button').forEach(b=>{const t=(b.textContent||'').trim();if(b.classList.contains('xbtn')||b.id==='fClose')return;if(/^(بستن|بستن و بازگشت|بازگشت|انصراف)$/.test(t)&&!b.dataset.xh){b.dataset.xh='1';b.style.display='none'}});
 if(!mb.querySelector('.xbtn')){const x=document.createElement('button');x.type='button';x.className='xbtn';x.textContent='✕';x.title='بستن';mb.insertBefore(x,mb.firstChild);
  x.onclick=()=>{const hid=[...mb.querySelectorAll('button')].find(b=>b.dataset.xh==='1'&&/^(بستن|بستن و بازگشت|بازگشت|انصراف)$/.test((b.textContent||'').trim()));if(hid)hid.click();$('md').hidden=true}}}
const __fx=$('fClose');
let __xT=null;new MutationObserver(()=>{clearTimeout(__xT);__xT=setTimeout(()=>{ensureX();const f=$('fClose');if(f){f.textContent='✕';f.title='بستن'}},25)}).observe(document.body,{childList:true,subtree:true});
ensureX();

/* ===== جزئیات بارنامه: دکمه‌های چاپ و خروجی اکسل ===== */
function billDetails(id){const b=billById(id);if(!b)return failOp('این بارنامه پیدا نشد.');
 const rows=[['شماره بارنامه',String(b.no)],['تاریخ رویداد ورود',String(b.date)],['ساعت رویداد',String(b.time||'—')],['تعداد کالا',String(b.qty)],['وزن باسکول‌شده (کیلوگرم)',String(b.weight)],['هزینه حمل',String(Math.round(b.freight||0))],['حواله ورودی لینک‌شده',billLinkLabel(b)]];
 openPanel('🚚 جزئیات بارنامه',`<div id="repOut"><div style="overflow:auto"><table><tbody>${rows.map(r=>'<tr><th>'+esc(r[0])+'</th><td>'+esc(FA(r[1]))+'</td></tr>').join('')}</tbody></table></div></div><div class="bt" style="margin-top:10px;justify-content:center"><button type="button" id="billPr" class="p">🖨 چاپ</button><button type="button" id="billXl" class="p">📊 خروجی اکسل</button></div>`);
 $('billPr').onclick=()=>window.print();
 $('billXl').onclick=()=>{try{if(typeof XLSX==='undefined')throw new Error('کتابخانهٔ اکسل بارگذاری نشده است');
  const data=[['فیلد','مقدار'],...rows.map(r=>[r[0],r[1]])];const ws=XLSX.utils.aoa_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'بارنامه');
  XLSX.writeFile(wb,'waybill-'+String(b.no)+'.xlsx');okMsg('فایل اکسل بارنامه ساخته شد')}catch(err){failOp(err.message||'ساخت فایل اکسل انجام نشد')}}}

/* ===== فهرست بارنامه: دکمهٔ بستن مطمئن ===== */
const _blo1=billListOpen;
billListOpen=function(){_blo1();try{const body=$('fBody');if(!body||body.querySelector('#billCloseBtn'))return;
 body.insertAdjacentHTML('beforeend','<div class="bt" style="justify-content:center;margin-top:10px"><button type="button" id="billCloseBtn" class="x">بستن</button></div>');
 $('billCloseBtn').onclick=()=>{const p=$('floatRep');if(p)p.remove()};
 const f=$('fClose');if(f)f.onclick=()=>{const p=$('floatRep');if(p)p.remove()}}catch(err){}};

/* ===== کلیدهای میانبر: F5 بخش بعد، F7 ذخیره، F9 عدم ذخیره، F10 انتخاب همه، F2 حذف، F3 گزارش سریع، F1 راهنما ===== */
function sectionOrder(){return [...document.querySelectorAll('#nav [data-t]')].map(b=>b.dataset.t).filter((v,i,a)=>a.indexOf(v)===i&&v!=='desk')}
function shortcutSaveForm(){const fs=$('fs');if(!$('md').hidden&&fs){fs.click();return true}return false}
function shortcutCancel(){if(!$('md').hidden){const iNo=$('iNo');if(iNo&&$('iPre')&&!$('md').hidden&&$('iPre').offsetParent!==null){iNo.click()}$('md').hidden=true;return true}return false}
function shortcutSelectAll(){const s=$(curTab);if(!s)return false;const rows=[...s.querySelectorAll('tbody .rc')];if(!rows.length)return false;const all=rows.every(c=>c.checked);rows.forEach(c=>{c.checked=!all;c.dispatchEvent(new Event('change',{bubbles:true}))});bulkUpd();return true}
function shortcutSelected(){const s=$(curTab);return s?s.querySelectorAll('tbody .rc:checked').length:0}
function shortcutHelp(){openPanel('⌨ راهنمای میانبرهای صفحه‌کلید',`<table><tbody>
<tr><th>F1</th><td>این راهنما</td></tr>
<tr><th>F5</th><td>رفتن به بخش بعدی</td></tr>
<tr><th>F7</th><td>ذخیره (ثبت فرم باز)</td></tr>
<tr><th>F9</th><td>عدم ذخیره و بستن فرم</td></tr>
<tr><th>F10</th><td>انتخاب همه (یا لغو انتخاب همه) موارد بخش فعلی</td></tr>
<tr><th>F2</th><td>حذف موارد انتخاب‌شده (به سطل بازیافت)</td></tr>
<tr><th>F3</th><td>گزارش سریع بخش فعلی</td></tr>
<tr><th>Esc</th><td>بستن پنجره‌های باز</td></tr></tbody></table>`)}
window.addEventListener('keydown',e=>{
 const k=e.key;const map={F1:1,F2:1,F3:1,F5:1,F7:1,F9:1,F10:1};
 if(e.key==='Escape'){const f=$('floatRep');if(f){f.remove();e.preventDefault();return}if(!$('md').hidden){shortcutCancel();e.preventDefault();return}}
 if(!map[k])return;
 if(!CU){return}
 e.preventDefault();e.stopPropagation();
 if(k==='F1'){shortcutHelp();return}
 if(k==='F5'){const order=sectionOrder();if(!order.length)return;const i=order.indexOf(curTab);const nxt=order[(i+1+order.length)%order.length];go(nxt);return}
 if(k==='F7'){if(shortcutSaveForm())return;try{save();render();okMsg('ذخیره شد')}catch(err){failOp(err.message||'ذخیره انجام نشد')}return}
 if(k==='F9'){if(!shortcutCancel())toast('فرم بازی برای عدم ذخیره وجود ندارد.');return}
 if(k==='F10'){if(!shortcutSelectAll())toast('در این بخش موردی برای انتخاب نیست.');return}
 if(k==='F2'){if(!shortcutSelected())return failOp('ابتدا موارد مورد نظر را تیک بزنید.');if(bulkBtn&&typeof bulkBtn.onclick==='function')bulkBtn.onclick();return}
 if(k==='F3'){if(!$(curTab)||!$(curTab).querySelector('table'))return failOp('این بخش گزارش ندارد.');floatRep(curTab,true);return}
},true);
(function(){const d=$('dataSub');if(d&&!$('shortHelpBtn')){d.insertAdjacentHTML('beforeend','<button type="button" id="shortHelpBtn">⌨ راهنمای میانبرها (F1)</button>');$('shortHelpBtn').onclick=shortcutHelp}})();

/* ===== ضربدر قرمز بستن: در همه بخش‌ها و پنجره‌ها کار می‌کند ===== */
document.addEventListener('click',e=>{const x=e.target.closest('.xbtn,#fClose');if(!x)return;
 e.preventDefault();e.stopPropagation();
 const fp=$('floatRep');
 if(x.id==='fClose'||(fp&&fp.contains(x))){if(fp)fp.remove();return}
 const md=$('md');if(md)md.hidden=true;
 const cf=$('confBox');if(cf&&cf.contains(x))cf.style.display='none';
},true);
function ensureXAlways(){const mb=$('mb');if(!mb)return;if(!mb.querySelector('.xbtn')){const x=document.createElement('button');x.type='button';x.className='xbtn';x.textContent='✕';x.title='بستن';mb.insertBefore(x,mb.firstChild)}}
setInterval(()=>{const md=$('md');if(md&&!md.hidden)ensureXAlways()},400);
</script></body></html>
