name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Make libraries offline
        shell: bash
        run: |
          mkdir -p www/libs
          cp node_modules/chart.js/dist/chart.umd.js www/libs/
          cp node_modules/xlsx/dist/xlsx.full.min.js www/libs/
          cp node_modules/sql.js/dist/sql-wasm.js node_modules/sql.js/dist/sql-wasm.wasm www/libs/
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js#libs/chart.umd.js#; s#https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js#libs/xlsx.full.min.js#' www/index.html
      - name: Make app icon
        shell: bash
        run: |
          mkdir -p build
          cp icon.png build/icon.png
      - name: Build installer
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: anbar-yar-windows
          path: dist/*.exe
